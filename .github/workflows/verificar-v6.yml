name: Verificar frontend LajuStore
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run build
      - run: node --test tests/v8-brand.test.mjs
      - run: node --test tests/login-mostrar-senha.test.mjs
      - run: node --test tests/mobile-fix.test.mjs
      - run: node --test tests/mobile-pdv-clientes.test.mjs
      - run: node --test tests/operacao-entrega.test.mjs
      - run: node --experimental-strip-types --test tests/financeiro-date.test.mjs
      - run: node --experimental-strip-types --test tests/excel-pdf-mensal.test.mjs
      - run: node --test tests/crediario-v8.test.mjs
      - run: node --test tests/desfazer-cancelamento-v9.test.mjs
